<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Timer para Começar a Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <style>
      body {
        background-color: #5a1f2e;
        margin: 0;
        padding: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: start;
        align-items: center;
        height: 100vh;
      }

      .container {
        display: flex;
        flex-direction: column;
        padding: 1vw 0;
        gap: 10vw;
        width: 100%;
      }

      .content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2vh;
        padding: 0 2vw;
        width: calc(100% - 4vw);
      }

      .text {
        font-family: 'Playfair Display', serif;
        color: white;
        line-height: 1;
      }

      .logo {
        width: 12vw;
        height: auto;
      }

      .title {
        text-align: right;
        font-size: 3vw;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <img class="logo" src="https://www.familiasdepoder.com.br/assets/images/logo-h-o.svg" alt="Logo Famílias de Poder" />
        <h1 class="title text">Semana da Transformação Familiar</h1>
      </div>
    </div>

    <script>
      const horaFinal = 20
      const minutoFinal = 0

      const timerElement = document.getElementById('timer')

      function atualizarTimer() {
        const agora = new Date()
        const dataFinal = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate(), horaFinal, minutoFinal, 0)

        let tempoRestante = dataFinal.getTime() - agora.getTime()

        if (tempoRestante < 0) {
          timerElement.textContent = 'Agora!'
          return
        }

        const minutos = Math.floor(tempoRestante / (1000 * 60))
        const segundos = Math.floor((tempoRestante % (1000 * 60)) / 1000)

        const textoTimer = `${String(minutos).padStart(2, '0')}:${String(segundos).padStart(2, '0')}`

        timerElement.textContent = textoTimer

        setTimeout(atualizarTimer, 1000)
      }

      atualizarTimer()
    </script>
  </body>
</html>
